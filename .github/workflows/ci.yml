name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: margix
          POSTGRES_PASSWORD: margix
          POSTGRES_DB: margix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U margix -d margix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PGPASSWORD: margix
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare test database
        run: |
          psql -h 127.0.0.1 -U margix -d margix_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE margix_app LOGIN PASSWORD 'margix_app_dev'" \
            -c "CREATE DATABASE margix_shadow"
          cat > .env.test <<'ENV'
          DATABASE_URL="postgresql://margix:margix@127.0.0.1:5432/margix_test?schema=public&connection_limit=20"
          DIRECT_DATABASE_URL="postgresql://margix:margix@127.0.0.1:5432/margix_test?schema=public"
          APP_DATABASE_URL="postgresql://margix_app:margix_app_dev@127.0.0.1:5432/margix_test?schema=public"
          SESSION_TTL_HOURS=12
          TALLY_MODE=mock
          LOG_LEVEL=warn
          ENV

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails when schema.prisma changed without a matching migration.
      - name: Check migrations match the schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://margix:margix@127.0.0.1:5432/margix_shadow"
          --exit-code

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: margix
          POSTGRES_PASSWORD: margix
          POSTGRES_DB: margix_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U margix -d margix_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      E2E_DATABASE_URL: postgresql://margix:margix@127.0.0.1:5432/margix_e2e?schema=public
      # `next build` only needs a syntactically valid URL; E2E runs use E2E_DATABASE_URL.
      DATABASE_URL: postgresql://margix:margix@127.0.0.1:5432/margix_e2e?schema=public
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build app and tools images
        run: |
          docker build --target tools -t margix-ims-tools:ci .
          docker build --target app -t margix-ims:ci .
