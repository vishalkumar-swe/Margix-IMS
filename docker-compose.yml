# Local Postgres for development. Works with `docker compose up -d` or `podman compose up -d`.
# Matches the DATABASE_URL in .env.example.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: margix-postgres
    environment:
      POSTGRES_USER: margix
      POSTGRES_PASSWORD: margix
      POSTGRES_DB: margix
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - margix_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  margix_pgdata:
